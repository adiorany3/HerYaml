# Clash for macOS (Hako): direct-only with remote YAML adblock providers; no MRS.
mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true
dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:7874
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - localhost.ptlogin2.qq.com
  - dns.msftncsi.com
  - www.msftconnecttest.com
  - connectivitycheck.gstatic.com
  - connect.rom.miui.com
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - router.asus.com
  - tplinkwifi.net
  - tendawifi.com
  - +.bca.co.id
  - +.bni.co.id
  - +.bri.co.id
  - +.mandiri.co.id
  - +.stun.*.*
  - +.stun.*.*.*
  - +.stun.*.*.*.*
  - +.stun.*.*.*.*.*
  - '*.n.n.srv.nintendo.net'
  - xbox.*.*.microsoft.com
  - '*.*.xboxlive.com'
  cache-algorithm: arc
  default-nameserver:
  - https://1.1.1.1/dns-query
  - https://9.9.9.9/dns-query
  nameserver:
  - https://family.dns.bebasid.com/dns-query
  - tls://family.dns.bebasid.com:853
  proxy-server-nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  - https://dns.quad9.net/dns-query
  - https://9.9.9.9/dns-query
  - https://94.140.14.14/dns-query
  nameserver-policy:
    +.openai.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.chatgpt.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.chatgpt.site:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.anthropic.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.claude.ai:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.claude.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    +.gemini.google.com:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
  fallback:
  - https://family.dns.bebasid.com/dns-query
  - tls://family.dns.bebasid.com:853
  fallback-lazy-query: false
  fallback-filter:
    geoip: true
    geoip-code: ID
    ipcidr:
    - 240.0.0.0/4
  prefer-h3: false
  use-hosts: true
  use-system-hosts: false
